version: 1
system:
  name: Kipp
  purpose: Run personal LinkedIn, Calendar, meal-planning and approval-gated Notes workflows from Telegram.
  runtime:
    platform: Cloudflare Workers
    entrypoint: src/index.ts

runtime_components:
  worker:
    owns:
      - HTTP routing
      - scheduled trigger dispatch
      - request authentication at protected routes
    depends_on:
      - pipeline_workflow
      - calendar_workflow
      - meal_planning_workflow
      - notes_workflow
      - token_vault
      - interaction_router
      - idea_ingest
      - triggers
  pipeline_workflow:
    implementation: src/linkedin/workflow.ts
    owns:
      - bounded LinkedIn native-tool drafting and revision orchestration
      - approval wait states
      - creating the LinkedIn draft after explicit approval
    depends_on:
      - ideas
      - agents
      - providers
      - runtime
      - integrations
      - token_vault
      - interaction_router
  calendar_workflow:
    implementation: src/calendar/workflow.ts and src/calendar/agent-workflow.ts
    owns:
      - bounded native-tool interpretation of one-off and recurring Calendar requests
      - safe transcript and versioned opaque plan and option ledger persistence
      - fixed Telegram actions and Calendar interaction wait states
      - fresh deterministic revalidation and idempotent Calendar writes
    depends_on:
      - calendar_domain
      - providers
      - runtime
      - integrations.google-calendar
      - token_vault
      - interaction_router
  meal_planning_workflow:
    implementation: src/meal-planning/workflow.ts and src/meal-planning/agent-workflow.ts
    owns:
      - bounded meal-planning agent session and evaluator-gated persistence
      - atomic active-plan creation and versioned revision promotion in D1
      - Telegram plan rendering, Give-feedback and force-reply prompts, and the week-long live loop
      - optional non-blocking recipe-video enrichment for lunch cells
    depends_on:
      - meal_planning_domain
      - providers
      - runtime
      - integrations.youtube-data-api
      - interaction_router
  notes_workflow:
    implementation: src/notes/workflow.ts and src/notes/runner.ts
    status: Implemented and restart-tested; editorial acceptance, production provisioning and integrated account walkthrough still gate release.
    owns:
      - deterministic Telegram invocation and snapshotted writing context
      - bounded writing sessions and exact owner/version/fingerprint approval
      - retained Notes event consumption and acceptance confirmation
      - structured timing extraction with strict receipt-anchored timezone resolution
      - explicit bounded repair of confirmed no-create failures
    depends_on:
      - agents
      - providers
      - integrations
      - token_vault
      - interaction_router
      - buffer_publications
      - notes_domain
      - writing
      - shared_time
  buffer_publications:
    implementation: src/integrations/buffer/publication.ts
    type: Cloudflare Durable Object with SQLite storage
    owns:
      - immutable approved payload and durable dispatch claim before one Buffer create
      - acceptance replay independent of Workflow checkpoints
      - terminal uncertainty and one bounded lookup of a captured post ID
      - owner-bound Retry delivery deduplication and rejected-attempt supersession
    depends_on:
      - token_vault
      - integrations
  token_vault:
    implementation: src/core/token-vault.ts
    type: Cloudflare Durable Object with SQLite storage
    owns:
      - OAuth state and expiry cleanup
      - provider-namespaced encrypted LinkedIn and Google Calendar token storage
      - Buffer encrypted grant and PKCE state storage (implemented; awaiting release)
      - Buffer-only coordinated rotating refresh with durable claims and credential generation fencing
      - token key rewrapping
    refresh_policy:
      decision: docs/architecture/decisions/ADR-003-buffer-only-coordinated-refresh.md
      buffer: Vault-owned refresh; overlapping callers share one operation; interrupted refresh requires reauthorization.
      linkedin: Existing scheduled token check refreshes outside the vault; no coordinated refresh.
      google_calendar: Existing API client refreshes outside the vault; no coordinated refresh.
      scope: Do not add LinkedIn or Calendar refresh coordination until concurrent workflows are explicitly supported and the extension is explicitly approved.
    depends_on:
      - crypto
      - Buffer OAuth token endpoint (Buffer refresh only; awaiting release)
  interaction_router:
    implementation: src/core/interaction-router.ts
    type: Cloudflare Durable Object with SQLite storage
    owns:
      - short-lived opaque Telegram interaction registrations
      - idempotent claim, acknowledgement, expiry, and bounded cleanup
      - Notes-only retained authenticated events, owner metadata and version invalidation
    depends_on: []
  idea_ingest:
    implementation: src/core/idea-ingest.ts
    type: Cloudflare Durable Object with SQLite storage
    owns:
      - idempotent Notion idea creation and adoption
      - deterministic per-page PipelineWorkflow start ownership and bounded repair
    depends_on:
      - ideas
      - pipeline_workflow

modules:
  notes_domain:
    path: src/notes
    owns:
      - first-link parsing and exact text/card/timing fingerprints
      - strict publication timing and immutable approval contracts
      - bounded repair conversation and Notes-only retained router delivery
    depends_on:
      - shared_time
      - interaction_router
      - buffer_publications
      - integrations
  writing:
    path: src/writing
    owns:
      - ordered GitHub prompt resolution with source provenance and missing-file-only fallback
    depends_on:
      - integrations.github
  shared_time:
    path: src/core/time.ts
    owns:
      - strict IANA-zone wall-time resolution with explicit gap and overlap outcomes
      - civil-date arithmetic and local-day bounds shared by Notes and Calendar
    depends_on:
      - Luxon
  triggers:
    path: src/triggers
    owns:
      - Telegram webhook handling
      - RSS, cadence, and token-check schedules
      - LinkedIn, Google Calendar and Buffer OAuth start and callback handling
    depends_on:
      - ideas
      - integrations
      - providers
      - pipeline_workflow
      - calendar_workflow
      - meal_planning_workflow
      - token_vault
      - interaction_router
      - idea_ingest
      - substack
      - notes_workflow
  substack:
    path: src/substack
    owns:
      - deterministic projection of RSS content:encoded HTML into title, subtitle, source URL, and H2-section content
      - bounded source-grounded candidate extraction and score-based selection for raw Notion ideas
    depends_on:
      - providers
      - runtime
      - ideas
      - linkedom_worker
  ideas:
    path: src/linkedin/ideas
    owns:
      - Notion-backed idea creation, retrieval, lifecycle updates, and queries
    depends_on:
      - integrations.notion
  linkedom_worker:
    type: npm runtime dependency (`linkedom/worker`)
    owns:
      - parsing RSS HTML fragments in the Cloudflare Worker runtime
  agents:
    path: src/agent
    owns:
      - workflow-specific prompts, native-tool contracts, and terminal outcomes
      - LinkedIn ready_for_review handoff and revision transcript
      - Calendar ready_to_create and needs_user_input handoffs
      - safe Calendar transcript persistence and event-list compaction
      - Meal-planning propose_plan and needs_clarification handoffs
      - Substack source-grounded idea extraction and ranked candidate handoff
      - Notes submit_note and ask_note_question handoffs; no publishing authority
    depends_on:
      - providers
      - runtime
  meal_planning_domain:
    path: src/meal-planning
    owns:
      - household profile, weekly inventory/exceptions, and plan-candidate types
      - deterministic evaluateMealPlan evaluation and coverage sets
      - D1 store: atomic active-plan creation, CAS revision promotion, immutable version and feedback-batch rows
      - week resolution, plan rendering, and canonical submission coercion
      - optional recipe-video enrichment with KV cache
    depends_on:
      - meal-planning-d1
      - recipe-video-cache
  calendar_domain:
    path: src/calendar
    owns:
      - strict one-off and recurring proposal schemas
      - aggregate typed semantic validation
      - civil-date recurrence expansion and Google-compatible RRULE generation
      - FreeBusy evaluation, candidate ranking, and conflict alternatives
      - versioned single-use plan and option authorization
      - Calendar event projection and deterministic operational messages
    depends_on:
      - integrations.google-calendar types and client
      - rrule
  runtime:
    path: src/runtime
    owns:
      - static typed tool registry and deterministic guard
      - three-turn and four-call bounded native-tool runner
      - tool batching, handoff, allowlist-transition, and repair policy
      - shared agent-session result, metadata-only logging, and HTTP constants
    depends_on:
      - providers
  providers:
    path: src/providers
    owns:
      - provider selection and normalized text plus native-tool generation interfaces
    depends_on:
      - Gemini API
      - DeepSeek API
      - OpenRouter API
  integrations:
    path: src/integrations
    owns:
      - Notion Ideas data-source access
      - GitHub Contents API access for style prompts
      - Telegram Bot API access
      - LinkedIn draft creation
      - Google Calendar FreeBusy, event creation, verification, and token refresh
      - Buffer OAuth, account/channel discovery and single-attempt GraphQL post submission
    depends_on:
      - Notion API
      - GitHub API
      - Telegram Bot API
      - LinkedIn API
      - Google Calendar API
      - Buffer OAuth and GraphQL API
  prompts:
    path: src/linkedin/prompts
    owns:
      - default writing-style prompt and optional GitHub resolution
    depends_on:
      - integrations.github
  crypto:
    path: src/core/crypto.ts
    owns:
      - AES-256-GCM token envelope encryption and decryption
    depends_on: []

data_stores:
  notion_ideas_data_source:
    type: Notion data source accessed through the Notion API
    data:
      - LinkedIn idea page bodies and metadata
      - Kipp ID, status, source, and idempotency key properties
    owner: ideas
  rss_article_input:
    type: transient in-memory workflow input
    data:
      - normalized Substack title and optional subtitle
      - source URL and ordered H2-section authored content
    owner: substack
  github_style_prompt_repository:
    type: Optional private GitHub repository accessed through the Contents API
    data:
      - optional style-prompt.md and notes-style-prompt.md or configured paths
    owner: prompts and notes_workflow
  token_vault_storage:
    type: Durable Object SQLite storage
    data:
      - provider-namespaced encrypted LinkedIn and Google Calendar OAuth tokens
      - short-lived OAuth state records
      - Buffer encrypted grant, credential generation, connection identity, and refresh claim (implemented; awaiting release)
    owner: token_vault
  interaction_router_storage:
    type: Durable Object SQLite storage
    data:
      - opaque Telegram callback and reply registrations
      - workflow target, interaction kind, version, expiry, and delivery state
      - Notes action authority, message bindings and immutable deliveries retained until review deadline plus one hour
    owner: interaction_router
  buffer_publication_storage:
    type: Durable Object SQLite storage, one object per approved publication
    data:
      - approved payload, fingerprint, version and approval evidence
      - durable dispatch claim and attempt/result evidence; no automatic deletion
    owner: buffer_publications
  idea_ingest_storage:
    type: Durable Object SQLite storage
    data:
      - idempotency key to Notion page ownership records
      - per-page workflow-start state and repair cooldown
    owner: idea_ingest
  meal_planning_d1:
    type: Cloudflare D1 database
    data:
      - household profile (seed only in iteration 1)
      - active plan header, immutable plan versions, and immutable feedback batches
      - chat-scoped plan-message generation counter
    owner: meal_planning_domain
  recipe_video_cache:
    type: Cloudflare KV namespace
    data:
      - per-dish/slot recipe-video search results with 24-hour per-key expiry
    owner: meal_planning_domain
  workflow_state:
    type: Cloudflare Workflows durable execution state
    data:
      - workflow steps
      - LinkedIn draft transcript and approval or revision events
      - Calendar safe transcript, typed proposals, exact plans, opaque plan and option ledger, created-event baseline, and wait events
      - Meal-planning session outcomes and live-loop wait events
      - Notes prompt/model/destination snapshot, bounded transcript, review actions and processed delivery IDs
    owner: pipeline_workflow and calendar_workflow and meal_planning_workflow and notes_workflow

external_systems:
  - Telegram Bot API
  - Substack RSS feed
  - Notion API
  - GitHub Contents API
  - LinkedIn OAuth and Posts API
  - Buffer OAuth and GraphQL API (Notes; awaiting release)
  - Google OAuth and Calendar API
  - Gemini API
  - DeepSeek API
  - OpenRouter API (GPT-6 Luna for Notes and meal planning)
  - YouTube Data API (optional recipe-video enrichment)
  - Cloudflare Access

security_boundaries:
  - Cloudflare Access protects the Worker hostname by default
  - A separate Access application bypasses only /webhook/telegram for Telegram delivery
  - Telegram webhook secret and allowed-user check protect the bypassed endpoint
  - Cloudflare Access JWT validation for setup and administration routes
  - OAuth state paired with an HTTP-only, secure cookie
  - Provider-namespaced AES-256-GCM encryption for LinkedIn and Google Calendar tokens at rest
  - LinkedIn posts are created as drafts only after explicit Telegram approval
  - Google Calendar uses owned-event and FreeBusy scopes; only bounded primary-calendar title and timing projections may enter model context
  - Calendar descriptions, locations, people, links, credentials, and raw provider responses never enter model context or content logs
  - Calendar plan and option IDs are opaque, version-scoped, expiring, and single-use
  - Calendar writes require fresh deterministic revalidation and remain idempotent outside the model tool session
  - Meal-planning D1 stores canonical plans and versions, never transcripts or raw provider text
  - Meal-planning interaction registrations are opaque, expiring, generation-invalidated, and single-claim
  - Meal-planning plan persistence is evaluator-gated and CAS-guarded (a stale revision changes nothing)
  - RSS article HTML is parsed and reduced before entering model context; images, captions, interface markup, raw tags, and attributes are excluded
  - RSS `content:encoded` is the sole v1 Substack body source; public-page scraping, undocumented APIs, browser rendering, and third-party extraction are deferred alternatives
  - Substack article retrieval is bound to the triggering RSS item; the agent cannot browse arbitrary URLs or induce outbound article fetches
  - Notes publishing requires owner/chat/workflow/version/fingerprint/deadline-bound approval; model output and typed publish text cannot authorize a create
  - Notes credentials remain outside the writer; publication and rotating refresh claims persist before provider mutations
  - Notes acceptance ends at Buffer; uncertainty cannot authorize another create and concurrent same-chat feedback remains unsupported
