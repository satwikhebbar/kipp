version: 1
system:
  name: Kipp
  purpose: Create approval-gated LinkedIn drafts and safe personal Google Calendar blocks from Telegram.
  runtime:
    platform: Cloudflare Workers
    entrypoint: src/index.ts

runtime_components:
  worker:
    owns:
      - HTTP routing
      - scheduled trigger dispatch
      - request authentication at protected routes
    depends_on:
      - pipeline_workflow
      - calendar_workflow
      - token_vault
      - interaction_router
      - triggers
  pipeline_workflow:
    implementation: src/workflow.ts
    owns:
      - bounded LinkedIn native-tool drafting and revision orchestration
      - approval wait states
      - creating the LinkedIn draft after explicit approval
    depends_on:
      - backlog
      - agents
      - providers
      - runtime
      - integrations
      - token_vault
      - interaction_router
  calendar_workflow:
    implementation: src/calendar-workflow.ts and src/calendar-agent-workflow.ts
    owns:
      - bounded native-tool interpretation of one-off and recurring Calendar requests
      - safe transcript and versioned opaque plan and option ledger persistence
      - fixed Telegram actions and Calendar interaction wait states
      - fresh deterministic revalidation and idempotent Calendar writes
    depends_on:
      - calendar_domain
      - providers
      - runtime
      - integrations.google-calendar
      - token_vault
      - interaction_router
  token_vault:
    implementation: src/token-vault.ts
    type: Cloudflare Durable Object with SQLite storage
    owns:
      - OAuth state and expiry cleanup
      - provider-namespaced encrypted LinkedIn and Google Calendar token storage
      - token key rewrapping
    depends_on:
      - crypto
  interaction_router:
    implementation: src/interaction-router.ts
    type: Cloudflare Durable Object with SQLite storage
    owns:
      - short-lived opaque Telegram interaction registrations
      - idempotent claim, acknowledgement, expiry, and bounded cleanup
    depends_on: []

modules:
  triggers:
    path: src/triggers
    owns:
      - Telegram webhook handling
      - RSS, cadence, and token-check schedules
      - LinkedIn and Google Calendar OAuth start and callback handling
    depends_on:
      - backlog
      - integrations
      - providers
      - pipeline_workflow
      - calendar_workflow
      - token_vault
      - interaction_router
  backlog:
    path: src/backlog
    owns:
      - parsing and serializing ideas and archive files
      - backlog mutation and archive retention
    depends_on:
      - integrations.github
  agents:
    path: src/agent
    owns:
      - workflow-specific prompts, native-tool contracts, and terminal outcomes
      - LinkedIn ready_for_review handoff and revision transcript
      - Calendar ready_to_create and needs_user_input handoffs
      - safe Calendar transcript persistence and event-list compaction
    depends_on:
      - providers
      - runtime
  calendar_domain:
    path: src/calendar-validation.ts, src/calendar-evaluation.ts, src/calendar-plan.ts, src/calendar-scheduling.ts, src/calendar-recurrence.ts, and src/calendar-messages.ts
    owns:
      - strict one-off and recurring proposal schemas
      - aggregate typed semantic validation
      - civil-date recurrence expansion and Google-compatible RRULE generation
      - FreeBusy evaluation, candidate ranking, and conflict alternatives
      - versioned single-use plan and option authorization
      - Calendar event projection and deterministic operational messages
    depends_on:
      - integrations.google-calendar types and client
      - rrule
  runtime:
    path: src/runtime
    owns:
      - static typed tool registry and deterministic guard
      - three-turn and four-call bounded native-tool runner
      - tool batching, handoff, allowlist-transition, and repair policy
      - shared agent-session result, metadata-only logging, and HTTP constants
    depends_on:
      - providers
  providers:
    path: src/providers
    owns:
      - provider selection and normalized text plus native-tool generation interfaces
    depends_on:
      - Gemini API
      - DeepSeek API
  integrations:
    path: src/integrations
    owns:
      - GitHub Contents API access
      - Telegram Bot API access
      - LinkedIn draft creation
      - Google Calendar FreeBusy, event creation, verification, and token refresh
    depends_on:
      - GitHub API
      - Telegram Bot API
      - LinkedIn API
      - Google Calendar API
  prompts:
    path: src/prompts
    owns:
      - default writing-style prompt and data-repository resolution
    depends_on:
      - integrations.github
  crypto:
    path: src/crypto.ts
    owns:
      - AES-256-GCM token envelope encryption and decryption
    depends_on: []

data_stores:
  github_data_repository:
    type: Private GitHub repository accessed through the Contents API
    data:
      - ideas.md
      - archive.md
      - optional style-prompt.md
    owner: backlog
  token_vault_storage:
    type: Durable Object SQLite storage
    data:
      - provider-namespaced encrypted LinkedIn and Google Calendar OAuth tokens
      - short-lived OAuth state records
    owner: token_vault
  interaction_router_storage:
    type: Durable Object SQLite storage
    data:
      - opaque Telegram callback and reply registrations
      - workflow target, interaction kind, version, expiry, and delivery state
    owner: interaction_router
  workflow_state:
    type: Cloudflare Workflows durable execution state
    data:
      - workflow steps
      - LinkedIn draft transcript and approval or revision events
      - Calendar safe transcript, typed proposals, exact plans, opaque plan and option ledger, created-event baseline, and wait events
    owner: pipeline_workflow and calendar_workflow

external_systems:
  - Telegram Bot API
  - Substack RSS feed
  - GitHub Contents API
  - LinkedIn OAuth and Posts API
  - Google OAuth and Calendar API
  - Gemini API
  - DeepSeek API
  - Cloudflare Access

security_boundaries:
  - Cloudflare Access protects the Worker hostname by default
  - A separate Access application bypasses only /webhook/telegram for Telegram delivery
  - Telegram webhook secret and allowed-user check protect the bypassed endpoint
  - Cloudflare Access JWT validation for setup and administration routes
  - OAuth state paired with an HTTP-only, secure cookie
  - Provider-namespaced AES-256-GCM encryption for LinkedIn and Google Calendar tokens at rest
  - LinkedIn posts are created as drafts only after explicit Telegram approval
  - Google Calendar uses owned-event and FreeBusy scopes; only bounded primary-calendar title and timing projections may enter model context
  - Calendar descriptions, locations, people, links, credentials, and raw provider responses never enter model context or content logs
  - Calendar plan and option IDs are opaque, version-scoped, expiring, and single-use
  - Calendar writes require fresh deterministic revalidation and remain idempotent outside the model tool session
