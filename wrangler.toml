name = "linkedin-pipeline"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# Durable Object — token vault
[[durable_objects.bindings]]
name = "TOKEN_VAULT"
class_name = "TokenVaultDO"

[[durable_objects.bindings]]
name = "INTERACTION_ROUTER"
class_name = "InteractionRouterDO"

[[durable_objects.bindings]]
name = "IDEA_INGEST"
class_name = "IdeaIngestDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenVaultDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["InteractionRouterDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["IdeaIngestDO"]

# Cloudflare Workflow binding
[[workflows]]
binding = "PIPELINE_WORKFLOW"
name = "linkedin-pipeline"
class_name = "PipelineWorkflow"

[[workflows]]
binding = "CALENDAR_WORKFLOW"
name = "kipp-calendar"
class_name = "CalendarWorkflow"

# Substack RSS poll — daily at 9:00 UTC
# Token check — Monday 8:00 UTC
# Cadence check — Monday 9:00 UTC
[triggers]
crons = ["0 9 * * *", "0 8 * * 1", "0 9 * * 1"]

# --- Vars (non-sensitive config; for dashboard deploy set these in the dashboard) ---
[vars]
SUBSTACK_RSS_URL = "https://your-name.substack.com/feed"
# LLM_MODEL = "gemini-3-flash-preview"
LLM_MODEL = "deepseek-v4-flash"
DATA_REPO_BRANCH = "main"
POSTING_CADENCE_DAYS = "7"
LINKEDIN_AUTHOR_URN = "urn:li:person:your-linkedin-person-urn"
TIMEZONE = "Asia/Kolkata"
WAIT_FOR_FEEDBACK_HOURS = "12"
LLM_PROVIDER = "deepseek"
LLM_MAX_RETRIES = "3"
DEPLOYMENT_ENV = "production"
ACCESS_TEAM = "my-team"
TOKEN_ENCRYPTION_KEY_IDS = "k20260720a"
# Set to your deployed worker URL, e.g. https://linkedin-pipeline.your-name.workers.dev
# LINKEDIN_REDIRECT_ORIGIN = "https://linkedin-pipeline.your-name.workers.dev"
# GOOGLE_CALENDAR_REDIRECT_ORIGIN = "https://linkedin-pipeline.your-name.workers.dev"
# Path to style prompt in the data repo. Falls back to src/linkedin/prompts/defaults.ts if not set or file missing.
# PROMPT_STYLE_PATH = "prompts/style-prompt.md"

# --- Notion (Ideas data source) ---
NOTION_IDEAS_DATA_SOURCE_ID = "your-notion-data-source-id"
# NOTION_FREE_TIER = "false"   # set to "false" to disable the 350 ms request throttle

# --- Secrets (set via `wrangler secrets put`; for local dev set in .dev.vars) ---
