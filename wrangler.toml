name = "linkedin-pipeline"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workflow binding
[[workflows]]
binding = "PIPELINE_WORKFLOW"
name = "linkedin-pipeline"
class_name = "PipelineWorkflow"

# Substack RSS poll — daily at 9:00 UTC
# Token check — Monday 8:00 UTC
# Cadence check — Monday 9:00 UTC
[triggers]
crons = ["0 9 * * *", "0 8 * * 1", "0 9 * * 1"]

# --- Vars (non-sensitive config; for dashboard deploy set these in the dashboard) ---
[vars]
SUBSTACK_RSS_URL = "https://your-name.substack.com/feed"
# LLM_MODEL = "gemini-3-flash-preview"
LLM_MODEL = "deepseek-v4-flash"
DATA_REPO_BRANCH = "main"
POSTING_CADENCE_DAYS = "7"
LINKEDIN_AUTHOR_URN = "urn:li:person:your-linkedin-person-urn"
TIMEZONE = "UTC"
WAIT_FOR_FEEDBACK_HOURS = "12"
LLM_PROVIDER = "deepseek"
LLM_MAX_RETRIES = "3"
# Set to your deployed worker URL, e.g. https://linkedin-pipeline.your-name.workers.dev
# LINKEDIN_REDIRECT_ORIGIN = "https://linkedin-pipeline.your-name.workers.dev"

# --- Secrets (set via `wrangler secrets put`; for local dev set in .dev.vars) ---
