name = "linkedin-pipeline"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workflow binding
[[workflows]]
binding = "PIPELINE_WORKFLOW"
name = "linkedin-pipeline"
class_name = "PipelineWorkflow"

# Substack RSS poll — daily at 9:00 UTC
# Token check — Monday 8:00 UTC
# Cadence check — Monday 9:00 UTC
[triggers]
crons = ["0 9 * * *", "0 8 * * 1", "0 9 * * 1"]

# --- Vars (set via wrangler.toml [vars] or dashboard) ---
# [vars]
# SUBSTACK_RSS_URL = "https://your-substack.substack.com/feed"
# LLM_MODEL = "gemini-2.0-flash"
# DATA_REPO_BRANCH = "main"
# POSTING_CADENCE_DAYS = "7"
# LINKEDIN_AUTHOR_URN = "urn:li:person:..."
# TIMEZONE = "UTC"
# WAIT_FOR_FEEDBACK_HOURS = "12"

# --- Secrets (set via `wrangler secrets put`) ---
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET
# LINKEDIN_CLIENT_ID
# LINKEDIN_CLIENT_SECRET
# LINKEDIN_ACCESS_TOKEN
# LINKEDIN_REFRESH_TOKEN
# LLM_API_KEY
# LLM_PROVIDER
# GITHUB_PAT
# DATA_REPO_OWNER
# DATA_REPO_NAME
